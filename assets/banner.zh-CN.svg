<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" role="img" aria-label="从零构建 AI — 分词器、自动微分、GPT、RAG、Agent、MCP，全部从零写起">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#131c2e"/><stop offset="1" stop-color="#16314f"/></linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.45" r="0.35"><stop offset="0" stop-color="#6fb2ff" stop-opacity=".28"/><stop offset="1" stop-color="#6fb2ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>
  <g transform="translate(180,190)"><rect x="-60" y="22" width="56" height="40" rx="6" fill="#6fb2ff"/><rect x="4" y="22" width="56" height="40" rx="6" fill="#6fb2ff" opacity=".7"/><rect x="-30" y="-24" width="60" height="40" rx="6" fill="#6fb2ff" opacity=".85"/><rect x="-14" y="-66" width="28" height="36" rx="6" fill="#6fb2ff" opacity=".55"/></g>
  <text x="330" y="138" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">从零构建 AI</text>
  <text x="330" y="196" font-size="30" font-weight="600" fill="#6fb2ff">分词器、自动微分、GPT、RAG、Agent、MCP，全部从零写起</text>
  <text x="330" y="244" font-size="20" fill="#c4c9d6">八章小而可读、带测试的 Python，在笔记本 CPU 上就能跑。不要 API key，不要 GPU，不用下载。</text>
  <g transform="translate(330,300)"><rect width="64" height="36" rx="18" fill="#6fb2ff" fill-opacity=".14" stroke="#6fb2ff" stroke-opacity=".55"/><text x="32" y="24" text-anchor="middle" font-size="16" fill="#e8ebf2">8 章</text></g>
  <g transform="translate(406,300)"><rect width="137" height="36" rx="18" fill="#6fb2ff" fill-opacity=".14" stroke="#6fb2ff" stroke-opacity=".55"/><text x="68" y="24" text-anchor="middle" font-size="16" fill="#e8ebf2">只依赖 numpy</text></g>
  <g transform="translate(555,300)"><rect width="147" height="36" rx="18" fill="#6fb2ff" fill-opacity=".14" stroke="#6fb2ff" stroke-opacity=".55"/><text x="74" y="24" text-anchor="middle" font-size="16" fill="#e8ebf2">每个数字都实测</text></g>
  <g transform="translate(714,300)"><rect width="117" height="36" rx="18" fill="#6fb2ff" fill-opacity=".14" stroke="#6fb2ff" stroke-opacity=".55"/><text x="59" y="24" text-anchor="middle" font-size="16" fill="#e8ebf2">238 个测试</text></g>
</svg>
