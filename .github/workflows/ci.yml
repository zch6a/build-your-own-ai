name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: tests need no write access.
permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      # Actions pinned to commits; the token is not left in the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3; it has no moving major tag
      # The lock file decides every version: a changed dependency is a reviewed change, not a surprise.
      - run: uv sync --locked --python ${{ matrix.python }}
      - name: Lint (ruff; the code is formatted by hand for the walkthroughs, so only the checks)
        run: uvx ruff@0.15.0 check byoai tests chapters scripts
      - run: uv run pytest -q
      - name: Every chapter's demo runs
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: for d in chapters/*/run.py; do echo "== $d"; uv run python "$d" > /dev/null; done
