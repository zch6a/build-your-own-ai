name: Release
# On a version tag: run the tests and every chapter's demo with a read-only token, then make the GitHub release
# (the version's CHANGELOG section). The job with write access runs nothing of the project: it only calls gh.
# Actions are pinned to commits.
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3; it has no moving major tag
      - run: uv sync --locked --python 3.13
      - name: The tag is the project version
        run: test "v$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "$GITHUB_REF_NAME"
      - run: uv run pytest -q
      - name: Every chapter's demo runs
        env:
          PYTHONIOENCODING: utf-8
        run: for d in chapters/*/run.py; do echo "== $d"; uv run python "$d" > /dev/null; done
      - name: Release notes from the CHANGELOG
        run: uv run python scripts/release_notes.py "${GITHUB_REF_NAME#v}" > notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
          if-no-files-found: error
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "Build Your Own AI $version" --notes-file notes.md --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
          echo "released $GITHUB_REF_NAME"
