[project]
name = "byoai"
version = "0.1.0"
description = "Build your own AI from scratch: tokenizer, autograd, GPT, inference, vector database, RAG, agent and MCP — each a small, tested, readable module that runs on a laptop CPU with no API key."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["llm", "transformer", "gpt", "tokenizer", "bpe", "autograd", "rag", "agent", "mcp", "vector-database", "hnsw", "education", "from-scratch"]
classifiers = [
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["byoai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
